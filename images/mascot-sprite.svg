<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32">
  <!-- 5-frame stepped sprite sheet, 32x32 each: idle-a, blink, idle-b(breathe), mew, click-reaction -->

  <!-- FRAME 1: idle, eyes open -->
  <g transform="translate(0,0)">
    <ellipse cx="16" cy="20" rx="4.5" ry="2" fill="#000" opacity=".12"/>
    <path d="M8 10 L11 3 L13 10 Z" fill="#ff2d55"/>
    <path d="M24 10 L21 3 L19 10 Z" fill="#3ddcff"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -20 0 v-3 a10 9 0 0 1 10 -9 Z" fill="#ff2d55"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -10 9 Z" fill="#3ddcff"/>
    <circle cx="12.5" cy="9" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="19.5" cy="9" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="12" cy="16" r="1.6" fill="#16121f"/>
    <circle cx="20" cy="16" r="1.6" fill="#16121f"/>
    <circle cx="10.5" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <circle cx="21.5" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <path d="M13.5 21 q2.5 2 5 0" stroke="#16121f" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FRAME 2: blink -->
  <g transform="translate(32,0)">
    <ellipse cx="16" cy="20" rx="4.5" ry="2" fill="#000" opacity=".12"/>
    <path d="M8 10 L11 3 L13 10 Z" fill="#ff2d55"/>
    <path d="M24 10 L21 3 L19 10 Z" fill="#3ddcff"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -20 0 v-3 a10 9 0 0 1 10 -9 Z" fill="#ff2d55"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -10 9 Z" fill="#3ddcff"/>
    <circle cx="12.5" cy="9" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="19.5" cy="9" r="1.6" fill="#ffd23f" opacity=".8"/>
    <path d="M10.3 16 h3.4" stroke="#16121f" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M18.3 16 h3.4" stroke="#16121f" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="10.5" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <circle cx="21.5" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <path d="M13.5 21 q2.5 2 5 0" stroke="#16121f" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FRAME 3: idle-b, "breathing" (slightly taller) -->
  <g transform="translate(64,0)">
    <ellipse cx="16" cy="20.5" rx="4.7" ry="2" fill="#000" opacity=".12"/>
    <path d="M8 9 L11 2 L13 9 Z" fill="#ff2d55"/>
    <path d="M24 9 L21 2 L19 9 Z" fill="#3ddcff"/>
    <path d="M16 5 a10.5 9.5 0 0 1 10.5 9.5 v3 a10.5 9.5 0 0 1 -21 0 v-3 a10.5 9.5 0 0 1 10.5 -9.5 Z" fill="#ff2d55"/>
    <path d="M16 5 a10.5 9.5 0 0 1 10.5 9.5 v3 a10.5 9.5 0 0 1 -10.5 9.5 Z" fill="#3ddcff"/>
    <circle cx="12.3" cy="8.5" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="19.7" cy="8.5" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="12" cy="15.5" r="1.7" fill="#16121f"/>
    <circle cx="20" cy="15.5" r="1.7" fill="#16121f"/>
    <circle cx="10.3" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <circle cx="21.7" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <path d="M13.3 21.5 q2.7 2.2 5.4 0" stroke="#16121f" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- FRAME 4: mew (mouth open, eyes wide) -->
  <g transform="translate(96,0)">
    <ellipse cx="16" cy="20" rx="4.5" ry="2" fill="#000" opacity=".12"/>
    <path d="M8 10 L11 3 L13 10 Z" fill="#ff2d55"/>
    <path d="M24 10 L21 3 L19 10 Z" fill="#3ddcff"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -20 0 v-3 a10 9 0 0 1 10 -9 Z" fill="#ff2d55"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -10 9 Z" fill="#3ddcff"/>
    <circle cx="12.5" cy="9" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="19.5" cy="9" r="1.6" fill="#ffd23f" opacity=".8"/>
    <circle cx="12" cy="16" r="2" fill="#16121f"/>
    <circle cx="20" cy="16" r="2" fill="#16121f"/>
    <circle cx="10.5" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <circle cx="21.5" cy="19" r="1.4" fill="#ff8c00" opacity=".55"/>
    <ellipse cx="16" cy="21.2" rx="1.6" ry="1.9" fill="#16121f"/>
  </g>

  <!-- FRAME 5: click reaction — heart eyes + sparkles -->
  <g transform="translate(128,0)">
    <ellipse cx="16" cy="20" rx="4.5" ry="2" fill="#000" opacity=".12"/>
    <path d="M8 10 L11 3 L13 10 Z" fill="#ff2d55"/>
    <path d="M24 10 L21 3 L19 10 Z" fill="#3ddcff"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -20 0 v-3 a10 9 0 0 1 10 -9 Z" fill="#ff2d55"/>
    <path d="M16 6 a10 9 0 0 1 10 9 v3 a10 9 0 0 1 -10 9 Z" fill="#3ddcff"/>
    <path d="M12 15.4 c-1.4-1.4-3.6-.3-3.2 1.4 c.3 1.3 2.3 2.6 3.2 3.3 c.9-.7 2.9-2 3.2-3.3 c.4-1.7-1.8-2.8-3.2-1.4Z" fill="#16121f"/>
    <path d="M20 15.4 c-1.4-1.4-3.6-.3-3.2 1.4 c.3 1.3 2.3 2.6 3.2 3.3 c.9-.7 2.9-2 3.2-3.3 c.4-1.7-1.8-2.8-3.2-1.4Z" fill="#16121f"/>
    <path d="M13 22 q3 2.4 6 0" stroke="#16121f" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M4 5 l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z" fill="#ffd23f"/>
    <path d="M27 6 l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6Z" fill="#d4ff3a"/>
  </g>
</svg>
